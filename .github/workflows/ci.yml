name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Same flags as the Dockerfile: use better-sqlite3's prebuilt binary
      # instead of compiling it from source with node-gyp.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Unit + integration tests
        run: npm test

      # The build opens the SQLite database once (as the Dockerfile's build
      # probe does), so point it at a throwaway file: no data/ dir in CI.
      - name: Build
        run: npm run build
        env:
          DATABASE_PATH: ${{ runner.temp }}/build-probe.sqlite
