# Apogée: self-hosted deployment.
#
#   cp .env.example .env   # then edit ORIGIN (and optionally ADMIN_*)
#   mkdir -p data && chown 1000:1000 data   # the container runs as user "node"
#   docker compose up -d
#
# The app listens on 127.0.0.1:3000. Put a reverse proxy in front (see
# Caddyfile.example): without a proxy declaring the public URL in ORIGIN,
# form submissions are rejected with a 403.

services:
  apogee:
    build: .
    container_name: apogee
    restart: unless-stopped
    # Loopback only: your reverse proxy connects via 127.0.0.1:3000. Never
    # publish this plain-HTTP port to the public internet.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - ORIGIN=${ORIGIN:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - HOUSEHOLD_NAME=${HOUSEHOLD_NAME:-Ma cave}
      - TZ=${TZ:-Europe/Paris}
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
